[package]
name = "avalio-lite"
version = "0.7.0"
edition = "2024"
description = "Lightweight, local edition of Avalio â€” a teacher-focused student evaluation app"
authors = ["Ran# <ran.hash@proton.me>"]
license-file = "LICENSE"
publish = false

[dependencies]
# release signatures (src/update/signature.rs): base64url text, BLAKE3 file hashes, Ed25519 keys
base64 = "0.23"
blake3 = "1.8"
# reads the workbooks the sheet imports (.xlsx, .xls, .ods); pure Rust
calamine = "0.37.0"
chrono = { version = "0.4", features = ["serde"] }
# the licence check against Clavren; a git tag so a fresh clone builds without the Clavren checkout next to it
clavren-client = { git = "https://github.com/Ran-n/clavren", tag = "v0.2.0" }
dirs = "7"
ed25519-dalek = "3.0.0"
log = { version = "0.4", features = ["std"] }
rfd = "0.17"
# SQLCipher: SQLite with page-level encryption. Building it compiles OpenSSL, which needs a full Perl
# (Strawberry Perl on Windows) at build time only; nothing of Perl or the build ends up in the exe.
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
# writes the .xlsx export; pure Rust
rust_xlsxwriter = "0.102.0"
# reads the version of the latest release (src/update/)
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.18"
sys-locale = "0.3"
thiserror = "2"
toml = "1"
# asks GitHub for the latest release and downloads updates; already used by clavren-client
ureq = "3"
zeroize = "1"

# where the window opens: the work area and scale of the screen the app starts on (src/app/placement.rs);
# opening a release page in the browser (src/window/dialogs.rs); where the installer put the app
# (src/update/windows.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"
# embeds assets/logo.ico in the exe, for Explorer, the Start menu and the uninstall entry
winresource = "0.1"

[dev-dependencies]
# signs licence tokens for the fake Clavren server the tests run against (tests/common/licence.rs),
# with ed25519-dalek from the dependencies
clavren-protocol = { git = "https://github.com/Ran-n/clavren", tag = "v0.2.0" }
# random bytes for a new release key (examples/release_sign.rs)
getrandom = "0.4"
uuid = { version = "1", features = ["v4"] }
# Slint's headless backend for the UI tests; pinned to the exact Slint version it belongs to.
i-slint-backend-testing = "=1.18.1"
# the desktop test driver reads where an open popup menu sits; internal API, so pinned the same way
i-slint-core = "=1.18.1"
# renders assets/logo.svg into the .ico and the PNG (examples/render_logo.rs) and checks them (tests/logo.rs)
ico = "0.6"
png = "0.18"
proptest = "1"
# the same version Slint renders SVGs with, so it isn't compiled twice
resvg = "0.48"
tempfile = "3"
# Win32 calls the desktop tests use to find, capture and click the real window
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Dependencies without debug info: far less to write per build (Slint, SQLCipher and OpenSSL are
# large), so builds and test runs are quicker. The app's own code keeps full debug info.
[profile.dev.package."*"]
debug = false

# What cargo-mutants builds with (.cargo/mutants.toml): no debug info anywhere, so each mutant's
# rebuild and link is as quick as it gets. Its own target folder; normal builds are untouched.
[profile.mutants]
inherits = "test"
debug = "none"

[profile.release]
lto = true
codegen-units = 1
strip = true
