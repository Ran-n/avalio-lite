# Builds the release for a version tag (v<version>): the Windows exe and installer, the bridge copies
# for the 0.6.0 to 0.10.0 updaters, their BLAKE3 sums, and a DRAFT GitHub release. The release key is
# never here: the maintainer signs the exes afterwards with scripts/release.ps1, then publishes.
# Asset names come from avalio-lite-asset-name; this file spells none out.

name: release

on:
  push:
    tags:
      - "v*.*.*"

# Read-only by default; each job asks for what it needs.
permissions:
  contents: read

jobs:
  verify:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with the manifest version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "avalio-lite") | .version')
          if [ "$tag" != "$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is for $tag, but Cargo.toml says $version"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches Cargo.toml ($version)"

  build:
    name: build windows-x86_64
    needs: verify
    runs-on: windows-latest
    env:
      AVALIO_LITE_RELEASE_TARGET: windows-x86_64
      # A short target folder: the OpenSSL build inside SQLCipher nests too deep for the 260-character
      # path limit when it sits under the checkout.
      CARGO_TARGET_DIR: ${{ runner.temp }}\target
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build the release exe
        shell: pwsh
        run: |
          # Strawberry Perl is on the runner; the toolchain comes from rust-toolchain.toml
          . .\scripts\use-perl.ps1
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with exit code $LASTEXITCODE" }

      - name: Build the portable exe and the installer
        shell: pwsh
        run: |
          . .\scripts\release-common.ps1
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release\avalio-lite.exe'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path dist (Get-AssetName -Form portable)) -ErrorAction Stop
          .\packaging\windows\build-installer.ps1 -Binary $exe -OutputDirectory dist
          if ($LASTEXITCODE -ne 0) { throw "build-installer.ps1 failed with exit code $LASTEXITCODE" }

      - name: Test the installer
        shell: pwsh
        run: |
          . .\scripts\release-common.ps1
          $setup = Join-Path dist (Get-AssetName -Form setup)
          .\packaging\windows\test-installer.ps1 -Installer $setup -BuildDirectory $env:CARGO_TARGET_DIR
          if ($LASTEXITCODE -ne 0) { throw "test-installer.ps1 failed with exit code $LASTEXITCODE" }

      - name: Make the bridge copies
        shell: pwsh
        run: |
          . .\scripts\release-common.ps1
          foreach ($form in 'portable', 'setup') {
            $from = Join-Path dist (Get-AssetName -Form $form)
            $to = Join-Path dist (Get-AssetName -Form $form -Bridge)
            Copy-Item -LiteralPath $from -Destination $to -ErrorAction Stop
          }

      - name: Install the pinned b3sum
        run: cargo install b3sum --version 1.8.5 --locked

      - name: Write and check the BLAKE3 sums
        shell: pwsh
        run: |
          . .\scripts\release-common.ps1
          $names = @(
            (Get-AssetName -Form portable),
            (Get-AssetName -Form setup),
            (Get-AssetName -Form portable -Bridge),
            (Get-AssetName -Form setup -Bridge)
          )
          Push-Location dist
          try {
            foreach ($name in $names) {
              $line = (& b3sum $name) -join ''
              if ($LASTEXITCODE -ne 0) { throw "b3sum failed on $name" }
              [System.IO.File]::WriteAllText("$name.b3", "$line`n", (New-Object System.Text.UTF8Encoding $false))
            }
            foreach ($name in $names) {
              & b3sum --check "$name.b3"
              if ($LASTEXITCODE -ne 0) { throw "$name.b3 doesn't match the file it was written for" }
            }
          } finally {
            Pop-Location
          }

      - name: Upload the release files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  attest:
    name: build provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "dist/*"

  publish:
    name: draft GitHub release
    needs: [verify, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-files
          path: dist
      - name: Check the files and the CHANGELOG section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          count=$(find dist -maxdepth 1 -type f | wc -l)
          exes=$(find dist -maxdepth 1 -type f -name '*.exe' | wc -l)
          sums=$(find dist -maxdepth 1 -type f -name '*.b3' | wc -l)
          if [ "$count" -ne 8 ] || [ "$exes" -ne 4 ] || [ "$sums" -ne 4 ]; then
            echo "::error::expected 8 files (4 exe, 4 .b3), found $count ($exes exe, $sums .b3)"
            exit 1
          fi
          if ! grep -qF "## [$version] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [$version] - date'"
            exit 1
          fi
          section=$(awk -v heading="## [$version] - " 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md)
          if [ -z "$(echo "$section" | tr -d '[:space:]')" ]; then
            echo "::error::the CHANGELOG.md section for $version is empty"
            exit 1
          fi
          {
            printf '%s\n\n' "$section"
            echo 'Windows 64-bit. Download the installer to install avalio lite, or the portable file to run it from any folder. Each file has a `.b3` checksum and a `.minisig` signature (`.sig` on the two older-named copies), which the app uses to check its updates; `minisign -Vm <file> -P <key>` checks one by hand with a key from the README.'
          } > release-notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "avalio lite $version" \
            --notes-file release-notes.md
